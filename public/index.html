<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareSync | Appointment Booking</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>CareSync Clinic Portal</h1>
    <p>Book and manage your healthcare appointments online</p>
  </header>

  <main class="container">
    <!-- FEATURE 1: BOOKING FORM -->
    <section class="card">
      <h2>1. Book an Appointment</h2>
      <div id="statusMessage" class="status hidden"></div>
      <form id="bookingForm">
        <label>Patient Full Name
          <input type="text" id="patientName" placeholder="e.g., Jordan Lee" required />
        </label>
        <label>Email Address
          <input type="email" id="patientEmail" placeholder="e.g., jordan@example.com" required />
        </label>
        <label>Department
          <select id="department" required>
            <option value="General Practice">General Practice</option>
            <option value="Dental Care">Dental Care</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Dermatology">Dermatology</option>
          </select>
        </label>
        <label>Preferred Date & Time
          <input type="datetime-local" id="appointmentDate" required />
        </label>
        <button type="submit" class="btn-primary">Confirm Booking</button>
      </form>
    </section>

    <!-- FEATURE 2: VIEW & CANCEL APPOINTMENTS -->
    <section class="card">
      <h2>2. Manage Appointments</h2>
      <input type="text" id="searchInput" placeholder="Filter by patient name or department..." />
      <div id="appointmentsList" class="list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
