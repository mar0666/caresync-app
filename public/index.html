<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareSync Clinic Portal</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>CareSync Clinic Portal</h1>
    <p>Book and manage your healthcare appointments online</p>
  </header>

  <main class="container">
    <section class="card">
      <h2>1. Book an Appointment</h2>
      <form id="bookingForm">
        <div class="form-group">
          <label for="patientName">Patient Full Name</label>
          <input type="text" id="patientName" name="patientName" placeholder="e.g., Jordan Lee" required />
        </div>

        <div class="form-group">
          <label for="emailAddress">Email Address</label>
          <input type="email" id="emailAddress" name="emailAddress" placeholder="e.g., jordan@example.com" required />
        </div>

        <div class="form-group">
          <label for="department">Department</label>
          <select id="department" name="department" required>
            <option value="General Practice">General Practice</option>
            <option value="Dental Care">Dental Care</option>
            <option value="Pediatrics">Pediatrics</option>
            <option value="Dermatology">Dermatology</option>
          </select>
        </div>

        <div class="form-group">
          <label for="appointmentDateTime">Preferred Date &amp; Time</label>
          <input type="datetime-local" id="appointmentDateTime" name="appointmentDateTime" required />
        </div>

        <button type="submit" class="btn-primary">Confirm Booking</button>
      </form>
    </section>

    <section class="card">
      <h2>2. Manage Appointments</h2>
      <div class="form-group">
        <input type="text" id="searchInput" placeholder="Filter by patient name or department..." aria-label="Filter appointments" />
      </div>
      <div id="appointmentsList" class="appointments-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
